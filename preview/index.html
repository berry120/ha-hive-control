<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hive Local Control · Preview</title>
  <style>
    :root { color-scheme:light; --primary-color:#b7761c; --primary-text-color:#262a30; --secondary-text-color:#747b85; --card-background-color:#fff; --divider-color:#e3e5e8; --secondary-background-color:#f3f4f6; --text-primary-color:#fff; font-family:system-ui,sans-serif; }
    :root.dark { color-scheme:dark; --primary-color:#dba14e; --primary-text-color:#eceef0; --secondary-text-color:#a1a8b2; --card-background-color:#262a31; --divider-color:#41454d; --secondary-background-color:#1b1e24; --text-primary-color:#23262c; }
    body { margin:0; min-height:100vh; background:var(--secondary-background-color); color:var(--primary-text-color); padding:clamp(24px,6vw,80px); }
    main { max-width:850px; margin:auto; } header { display:flex; justify-content:space-between; gap:20px; align-items:center; }
    h1 { font-size:30px; font-weight:550; letter-spacing:-1px; } p { color:var(--secondary-text-color); font-size:14px; line-height:1.6; }
    hive-local-card { display:block; max-width:420px; margin:28px 0; } button { font:inherit; border:1px solid var(--divider-color); color:inherit; background:var(--card-background-color); border-radius:12px; padding:10px 16px; cursor:pointer; }
    .label { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--secondary-text-color); } .note { max-width:430px; }
  </style>
</head>
<body>
  <main><div class="label">Hive Local Control</div><header><h1>A warmer welcome.</h1><button id="theme">Change theme</button></header>
    <p>Click the temperature to open schedules, holiday settings and more.</p>
    <hive-local-card></hive-local-card>
    <p class="note">Interactive preview with simulated data. These controls do not connect to Home Assistant or your heating.</p>
  </main>
  <script type="module" src="./demo.js"></script>
</body>
</html>
